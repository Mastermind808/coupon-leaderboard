name: Sync leaderboard and deploy

# No schedule. Counts land as commits to data.json on main
# (6:00 AM, 2:00 PM, and 10:00 PM HST). A cron would commit over those updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync coupon counts from GoHighLevel
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
        run: |
          if [ -z "$GHL_API_KEY" ]; then
            echo "::warning title=Missing GHL_API_KEY::Repo secret GHL_API_KEY is not set. Leaving the seeded data.json in place and continuing the deploy."
            exit 0
          fi
          node scripts/sync-ghl.mjs

      - name: Commit data.json when counts change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json unchanged"
          else
            git commit -m "Update coupon leaderboard counts"
            git push
          fi

      - name: Collect the static site
        run: |
          rm -rf site-dist
          mkdir -p site-dist
          cp index.html 404.html .nojekyll config.json data.json site-dist/
          cp -r css js assets site-dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
